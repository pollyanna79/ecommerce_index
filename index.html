<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polly e-commerce - Sua Loja Online</title>
    <link rel="stylesheet" href="projetostyle.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <h1>Polly e-commerce</h1>
        <div class="header-controls">
            <button type="button" class="tracking-status-btn" id="tracking-btn">
                <span class="tracking-icon">🚚</span>
                <span id="order-status-text">Pedidos</span>
                <span id="order-count-badge" style="background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.8em; display: none;">0</span>
            </button>
            <div class="cart-icon">
                <span id="cart-counter">0</span>
                <button id="view-cart-btn">🛒 Carrinho</button>
            </div>
        </div>
    </header>

    <main>
        <aside class="filters">
            <h2>Filtros</h2>
            <div class="filter-group">
                <label for="filter-type">Tipo:</label>
                <select id="filter-type">
                    <option value="all">Todos</option>
                    <option value="Eletrônico">Eletrônicos</option>
                    <option value="Roupas">Roupas</option>
                    <option value="livraria">Livros</option>
                </select>
            </div>
          
            <div class="filter-group">
                <label for="filter-price">Preço até:</label>
                <select id="filter-price">
                    <option value="all">Todos os preços</option>
                    <option value="0-50">Até R$ 50,00</option>
                    <option value="51-100">R$ 51,00 a R$ 100,00</option>
                    <option value="101-2000">R$ 101,00 a R$ 2000,00</option>
                </select>
            </div>
            <button type="button" id="btn-buscar-filtros" class="btn-primary" style="width: 100%; margin-top: 10px;">
                🔍 Aplicar Filtros
            </button>
        </aside>

        <section class="product-list" id="product-list"></section>

        <div id="cart-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn" data-modal="cart-modal">&times;</span>
                <h2>Seu Carrinho</h2>
                <div id="cart-items"></div>
                <div class="cart-total-container">
                    <strong>Total: R$ <span id="cart-total">0,00</span></strong>
                </div>
                <button id="checkout-btn" class="btn-primary">Comprar</button>
            </div>
        </div>

        <div id="checkout-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn" data-modal="checkout-modal">&times;</span>
                <h2>Finalizar Compra</h2>
                <form id="checkout-form">
                    <div id="checkout-summary-details">
                        <div class="summary-line">Total: R$ <span id="checkout-total">0,00</span></div>
                    </div>
                    <hr>
                    <h3>Método de Pagamento</h3>
                    <div class="payment-options">
                        <label><input type="radio" name="payment-method" value="pix" checked> Pix (Frete Grátis)</label><br>
                        <label><input type="radio" name="payment-method" value="cartao"> Cartão de Crédito</label>
                    </div>
                    <button type="submit" id="pay-now-btn" class="btn-primary" style="width: 100%; margin-top: 20px;">Finalizar Pedido</button>
                </form>
            </div>
        </div>

        </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Polly e-commerce - Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="funcoes.js"></script>
</body>
</html>
