<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polly e-commerce - Sua Loja Online</title>
    <link rel="stylesheet" href="projetostyle.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <h1>Polly e-commerce</h1>
        <div class="header-controls">
            
            <button type="button" class="tracking-status-btn" id="tracking-btn">
                <span class="tracking-icon">🚚</span>
                <span id="order-status-text">Pedidos</span>
                <span id="order-count-badge" style="display: none;">0</span>
            </button>
            <div class="cart-icon">
                <span id="cart-counter">0</span>
                <button id="view-cart-btn">🛒 Carrinho</button>
            </div>
        </div>
    </header>

    <main>
        <aside class="filters">
            <h2>Filtros</h2>
            <div class="filter-group">
                <label for="filter-type">Tipo:</label>
                <select id="filter-type">
                    <option value="all">Todos</option>
                    <option value="Eletrônico">Eletrônicos</option>
                    <option value="Roupas">Roupas</option>
                    <option value="livraria">Livros</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-price">Preço até:</label>
                <select id="filter-price">
                    <option value="all">Todos os preços</option>
                    <option value="0-50">Até R$ 50,00</option>
                    <option value="51-100">R$ 51,00 a R$ 100,00</option>
                    <option value="101-2000">R$ 101,00 a R$ 2000,00</option>
                </select>
            </div>
            <button type="button" id="btn-buscar-filtros" class="btn-primary">🔍 Aplicar Filtros</button>
        </aside>

        <section class="product-list" id="product-list"></section>

        <div id="cart-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn" data-modal="auth-modal">×</span>
                <h2>Seu Carrinho</h2>
                <div id="cart-items"></div>
                <div class="cart-total-container">
                    <strong>Total: R$ <span id="cart-total">0,00</span></strong>
                </div>
                <button id="checkout-btn" class="btn-primary">Comprar</button>
            </div>
        </div>

        <div id="checkout-modal" class="modal">
            <span class="close-btn" data-modal="auth-modal">×</span>
            <div class="modal-content">
                
                <h2>Finalizar Compra</h2>
                <div id="resumo-conteudo"></div>
                <form id="checkout-form">
                    <div class="payment-options">
                        <label><input type="radio" name="payment-method" value="pix" onclick="mostrarCampos('pix')" checked> Pix</label>
                        <label><input type="radio" name="payment-method" value="cartao" onclick="mostrarCampos('cartao')"> Cartão</label>
                    </div>
                    <div id="campos-cartao" style="display:none;">
                        <input type="text" id="num-cartao" placeholder="Número do Cartão">
                    </div>
                    <div id="campos-pix" style="display:none;">
                        <p>Chave Pix: 123.456.789-00</p>
                    </div>
                    <button type="submit" id="btn-primary">Finalizar Pedido</button>
                </form>
            </div>
        </div>

     <div id="auth-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn" data-modal="auth-modal">×</span>
        
        <h2 id="auth-title">Entrar</h2>

        <div id="container-login">
            <input type="email" id="email-login" placeholder="Email">
            <input type="password" id="senha-login" placeholder="Senha">
        </div>

        <div id="campos-cadastro-extra" style="display: none;">
            <input type="text" id="nome-cadastro" placeholder="Nome Completo">
            <input type="text" id="cpf-auth" placeholder="CPF">
            <input type="text" id="telefone-auth" placeholder="Telefone">
            <input type="text" id="endereco-auth" placeholder="Endereço">
            <input type="text" id="numero-auth" placeholder="Número">
            <input type="text" id="cep-auth" placeholder="CEP">
            <input type="email" id="email-cadastro" placeholder="Email">
            <input type="password" id="senha-cadastro" placeholder="Senha">
        </div>

        <button id="btn-login-executar" class="btn-primary">Confirmar</button>
        
        <p id="toggle-link" onclick="alternarModo()" style="cursor:pointer; color: blue;">
            Ainda não tem conta? Clique aqui.
        </p>
    </div>
</div>
    </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <script src="config.js"></script>
<script src="funcoes.js" defer></script>
</body>
</html>
